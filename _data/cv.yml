          - Reduction of the data dimension using factor analysis of mixed data (FAMD) combined with correlation method to retrieve only most important features in dataset.
          - Analysis of the cluster using Kolmogorov-Smirnov statistical test and density peak detection to identify conditions to create understandable customer personae.

